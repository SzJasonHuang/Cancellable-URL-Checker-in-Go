<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MTG Card Deal Finder</title>
<h1>MTG Card Deal Finder</h1>
<p>Compare prices from three simulated card shops.</p>
<form>
  <input name="card" aria-label="Card name" placeholder="Sol Ring"
         value="{{.Card}}" required>
  <button>Find deals</button>
</form>

{{if .Card}}
  <h2>{{.Card}}</h2>
  <ul>
    {{range .Results}}<li>{{.Shop}} — {{.Price}}</li>{{end}}
  </ul>
  {{if .Best}}<p><strong>Best price found:</strong> {{.Best}}</p>{{end}}
{{end}}
</html>
